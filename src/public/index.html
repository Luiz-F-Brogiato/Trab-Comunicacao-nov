<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobranças demonstrativas</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172b3a; background: #f1f5f8; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 16px; }
        main { width: min(100%, 520px); margin: 0 auto; }
        .brand, .card { background: white; border-radius: 16px; box-shadow: 0 8px 30px #18344912; }
        .brand { padding: 18px 24px; margin-bottom: 18px; color: #147d64; font-size: .82rem; font-weight: 750; letter-spacing: .08em; }
        .card { padding: 28px; }
        .eyebrow { color: #147d64; font-size: .76rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 8px 0; font-size: 1.8rem; }
        .intro, .hint { color: #607181; line-height: 1.5; }
        form { display: grid; gap: 10px; margin-top: 24px; }
        label { font-size: .9rem; font-weight: 650; }
        input { width: 100%; padding: 12px; border: 1px solid #c9d4dc; border-radius: 8px; font: inherit; }
        button { padding: 12px 16px; border: 0; border-radius: 8px; background: #147d64; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { cursor: wait; opacity: .65; }
        #result { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e3e9ed; }
        .amount { margin: 8px 0; font-size: 1.8rem; font-weight: 750; }
        .demo-box { margin: 16px 0; padding: 14px; border: 1px dashed #9aabb7; border-radius: 10px; color: #536978; font-size: .88rem; text-align: center; }
        .status { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #fff3d4; color: #785400; font-size: .85rem; font-weight: 700; }
        .status[data-status="approved"] { background: #dff5e8; color: #17613a; }
        .status[data-status="rejected"], .status[data-status="cancelled"] { background: #fde4e2; color: #8d2923; }
        .subtle { overflow-wrap: anywhere; color: #607181; font-size: .82rem; }
        .error { color: #a42b24; }
        .success { color: #17613a; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <div class="brand">OFICINA DE WEBHOOK · AMBIENTE DEMONSTRATIVO</div>
        <section class="card">
            <div class="eyebrow">Cobrança simulada</div>
            <h1>Receber por PIX</h1>
            <p class="intro">Crie uma cobrança demonstrativa e acompanhe as atualizações de status.</p>
            <form id="payment-form">
                <label for="cliente">Nome do cliente</label>
                <input type="text" name="cliente" id="cliente" autocomplete="name" maxlength="120" placeholder="Ex.: Ana Silva" required>
                <label for="valor">Valor em reais</label>
                <input type="number" name="valor" id="valor" min="0.01" max="99999999.99" step="0.01" placeholder="50,00" required>
                <button id="create-button" type="submit">Criar cobrança</button>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
            <section id="result" aria-live="polite" hidden>
                <div class="eyebrow">Cobrança criada</div>
                <div id="amount" class="amount"></div>
                <p id="customer"></p>
                <div class="demo-box">Representação ilustrativa<br>Não é um QR Code PIX pagável</div>
                <p>Status: <span id="status" class="status"></span></p>
                <p id="payment-id" class="subtle"></p>
                <button id="simulate-button" type="button">Simular recebimento</button>
            </section>
        </section>
    </main>
    <script>
        const form = document.querySelector("#payment-form");
        const createButton = document.querySelector("#create-button");
        const simulateButton = document.querySelector("#simulate-button");
        const result = document.querySelector("#result");
        const message = document.querySelector("#message");
        const statusLabel = document.querySelector("#status");
        let payment = null;

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = isError ? "error" : "success";
        }

        function renderPayment(value) {
            payment = value;
            result.hidden = false;
            document.querySelector("#amount").textContent = new Intl.NumberFormat("pt-BR", {
                style: "currency", currency: "BRL"
            }).format(value.valor);
            document.querySelector("#customer").textContent = `Cliente: ${value.cliente}`;
            document.querySelector("#payment-id").textContent = `Identificador: ${value.id}`;
            statusLabel.textContent = value.status;
            statusLabel.dataset.status = value.status;
            simulateButton.disabled = value.status === "approved";
            simulateButton.textContent = value.status === "approved" ? "Recebimento simulado" : "Simular recebimento";
        }

        async function readResponse(response) {
            const data = await response.json();
            if (!response.ok) throw new Error(data.erro || "Não foi possível concluir a operação.");
            return data;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            showMessage("");
            createButton.disabled = true;
            try {
                const data = await readResponse(await fetch("/pagamentos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        cliente: form.elements.cliente.value.trim(),
                        valor: Number(form.elements.valor.value)
                    })
                }));
                renderPayment(data.pagamento);
                showMessage("Cobrança criada com sucesso.");
            } catch (error) {
                showMessage(error.message || "Erro ao criar a cobrança.", true);
            } finally {
                createButton.disabled = false;
            }
        });

        simulateButton.addEventListener("click", async () => {
            if (!payment) return;
            showMessage("");
            simulateButton.disabled = true;
            try {
                const data = await readResponse(await fetch(`/pagamentos/${encodeURIComponent(payment.id)}/simular`, {
                    method: "POST"
                }));
                renderPayment(data.pagamento);
                showMessage("Recebimento simulado e status atualizado.");
            } catch (error) {
                simulateButton.disabled = false;
                showMessage(error.message || "Erro ao simular o recebimento.", true);
            }
        });
    </script>
</body>
</html>
